name: ci

# What CI does here.
#
# Job one runs the Python model test suite, the style checks, a regeneration
# check on both generated VHDL files, the check that every figure in the README
# still comes from the models, every testbench under GHDL with VUnit as the
# runner and a synthesis elaboration of every unit.
#
# Job two synthesises the whole design with Yosys and the GHDL plugin, places
# and routes it with nextpnr-ecp5 for an LFE5U-45F-8BG381C and fails if the
# tool's timing analysis says the 100 MHz fabric clock is not met. It also fails
# if the resource and Fmax figures committed in fpga/ecp5/ no longer match what
# the tools produce, so the published numbers cannot go stale. Those figures
# are open-tool estimates for one device: no vendor tool has been run and
# nothing has been on a board, and docs/10-limitations-and-roadmap.md says so.
#
# Why two jobs.
#
# Runner time is billed per job, so splitting work that takes a minute buys
# nothing. Place and route takes several minutes, needs none of job one's
# toolchain and depends on none of its results, so it runs alongside rather
# than after. Further economies, in order of how much they save:
#
#   timeout-minutes caps a hung simulation or router at a fixed time instead of
#   the six hours a runner will otherwise sit there for.
#
#   concurrency with cancel-in-progress stops a superseded push from finishing.
#   Pushing three times in a minute then costs one run, not three.
#
#   the cheap checks run before GHDL is installed, so a lint or model failure
#   never pays for the toolchain download.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: models, testbenches and synthesis check
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Cheapest first. None of these needs GHDL, so a failure here costs
      # nothing but the checkout.
      - name: Python style
        run: ruff check .

      - name: VHDL style
        run: vsg -c vsg.yaml -f rtl/*.vhd tb/*.vhd

      - name: Model test suite
        run: python -m pytest -q

      # The angle table and the machine constants are generated from focmodel.
      # If either committed file no longer matches what the generator produces,
      # the RTL and the models have drifted and the vectors would be checking
      # the wrong arithmetic.
      - name: Generated files are up to date
        run: python scripts/gen_tables.py --check

      # Every figure quoted in the README is recomputed from the models here.
      - name: README numbers are the model's numbers
        run: python scripts/check_claims.py

      - uses: ghdl/setup-ghdl@v1.5.1
        with:
          version: "5.0.1"
          backend: llvm

      - name: Versions
        run: ghdl --version

      - name: Generate the testbench vectors
        run: make vectors PYTHON=python

      # Every self-checking testbench, run by VUnit (run.py), one simulation
      # per test case. Each testbench counts its comparisons, prints the count
      # and fails if any comparison did not hold or if it managed to run no
      # comparisons at all.
      - name: Run every testbench
        run: make sim PYTHON=python

      - name: Elaborate every unit through the synthesiser
        run: make synth PYTHON=python

  ecp5:
    name: ECP5 synthesis, place and route, timing
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v5

      # The images are pinned by digest in the flow script, so this pulls
      # exactly what produced the committed results.
      - name: Pull the pinned tool images
        run: |
          grep -o 'hdlc/[a-z]*:[a-z0-9]*@sha256:[0-9a-f]*' scripts/ecp5_flow.sh \
            | sort -u | xargs -n 1 docker pull -q

      # Fails if timing at 100 MHz is not met or if fpga/ecp5/results.json no
      # longer matches what the tools produce.
      - name: Synthesise, place and route, check timing and the published figures
        run: scripts/ecp5_flow.sh --check

      - name: Keep the logs and the report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ecp5-build
          path: |
            build/ecp5/*.log
            build/ecp5/report.json
            build/ecp5/yosys_stat.txt
          retention-days: 14
